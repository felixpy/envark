name: Build desktop applications

on:
  push:
    branches: [main, fix/fel-23-macos-signing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}
