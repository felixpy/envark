name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to resume (leave empty to maintain the Release PR)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        if: inputs.tag == ''
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Resolve the draft and immutable source commit
        id: resolve
        run: node scripts/resolve-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_TAG: ${{ steps.release.outputs.tag_name }}
          NEW_SHA: ${{ steps.release.outputs.sha }}
          RETRY_TAG: ${{ inputs.tag }}

  desktop:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, desktop]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: envark-*
          path: packages
      - name: Verify every installer, upload checksums, and publish
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
