name: Desktop build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - name: Ubuntu x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Check release version consistency
        run: node scripts/check-versions.mjs
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build native installers
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci
        env:
          NO_STRIP: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: envark-${{ matrix.target }}
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
