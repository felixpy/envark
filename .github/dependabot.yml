version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 3
    groups:
      go-patches:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
