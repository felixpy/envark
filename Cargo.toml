[workspace]
members = ["crates/envark-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/felixpy/envark"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1
